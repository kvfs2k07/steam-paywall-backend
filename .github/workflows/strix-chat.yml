name: Strix AI Inline Chat

on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

concurrency:
  group: strix-chat-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  reply:
    name: Strix Inline Reply
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Respond with Strix
        uses: actions/github-script@v7
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const apiKey = process.env.NVIDIA_API_KEY;
            if (!apiKey) {
              core.info('NVIDIA_API_KEY secret not found; skipping Strix chat.');
              return;
            }

            const comment = context.payload.comment;
            if (!comment || comment.user?.type === 'Bot' || comment.user?.login?.includes('[bot]')) {
              core.info('Comment is from a bot; ignoring to prevent loops.');
              return;
            }

            const isReviewComment = context.eventName === 'pull_request_review_comment';
            const isIssueComment = context.eventName === 'issue_comment';
            const pr = context.payload.pull_request || (isIssueComment && context.payload.issue?.pull_request ? context.payload.issue : null);

            if (!pr) {
              core.info('Not a pull request comment; skipping.');
              return;
            }

            const prNumber = pr.number;
            const commentBody = (comment.body || '').trim();
            const mentionsStrix = /@strix\b|\/strix\b/i.test(commentBody);

            let shouldReply = false;
            let threadHistory = [];
            let rootComment = null;

            if (isReviewComment && comment.path) {
              if (mentionsStrix) {
                shouldReply = true;
              } else if (comment.in_reply_to_id) {
                try {
                  const rootRes = await github.rest.pulls.getReviewComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.in_reply_to_id
                  });
                  rootComment = rootRes.data;
                  const rootBody = rootComment?.body || '';
                  const rootAuthor = rootComment?.user?.login || '';
                  
                  if (rootAuthor.includes('actions') || rootAuthor.includes('github-actions') || /strix|vuln-|severity:|finding:|security review/i.test(rootBody)) {
                    shouldReply = true;
                  }
                } catch (e) {
                  core.warning(`Failed to fetch root comment: ${e.message}`);
                }
              }

              if (shouldReply) {
                try {
                  const allCommentsRes = await github.rest.pulls.listReviewComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    per_page: 100
                  });
                  const allComments = allCommentsRes.data || [];
                  const rootId = comment.in_reply_to_id || comment.id;
                  
                  threadHistory = allComments
                    .filter(c => c.id === rootId || c.in_reply_to_id === rootId || c.id === comment.id)
                    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
                    .map(c => `[${c.user?.login || 'user'}]: ${c.body}`);
                } catch (e) {
                  core.warning(`Failed to list review thread comments: ${e.message}`);
                }
              }
            } else if (isIssueComment) {
              if (mentionsStrix) {
                shouldReply = true;
                threadHistory.push(`[${comment.user?.login || 'user'}]: ${commentBody}`);
              }
            }

            if (!shouldReply) {
              core.info('Comment does not mention @strix and is not in a Strix thread.');
              return;
            }

            try {
              if (isReviewComment && comment.path) {
                await github.rest.reactions.createForPullRequestReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                  content: 'eyes'
                });
              } else {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                  content: 'eyes'
                });
              }
            } catch { /* ignore reaction errors */ }

            let surroundingCode = '';
            const targetSha = comment.commit_id || pr.head?.sha;
            if (comment.path && targetSha) {
              try {
                const fileRes = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: comment.path,
                  ref: targetSha
                });
                if (fileRes.data?.content && fileRes.data?.encoding === 'base64') {
                  const fileText = Buffer.from(fileRes.data.content, 'base64').toString('utf8');
                  const lines = fileText.split('\n');
                  const targetLine = comment.line || comment.original_line || 1;
                  const startLine = Math.max(0, targetLine - 25);
                  const endLine = Math.min(lines.length, targetLine + 25);
                  surroundingCode = lines.slice(startLine, endLine).map((l, idx) => `${startLine + idx + 1}: ${l}`).join('\n');
                }
              } catch (e) {
                core.info(`Could not fetch file content directly: ${e.message}`);
              }
            }

            const systemPrompt = [
              'You are Strix, an expert application security researcher and penetration testing AI assisting developers directly in GitHub Pull Request code review threads.',
              'You analyze security vulnerabilities, verify whether findings are exploitable or false positives, suggest robust mitigation patterns, and explain attack vectors.',
              '',
              'Guidelines:',
              '- Be concise, direct, and authoritative on application security.',
              '- Avoid unnecessary fluff or greeting formalities.',
              '- If providing code fixes, provide concrete, drop-in replacement code snippets matching the language and style of the project.',
              '- Answer the developer\'s specific question accurately based on the code context.'
            ].join('\n');

            let promptContext = `### Pull Request Context\n- PR Title: ${pr.title || 'Unknown'}\n`;
            if (comment.path) {
              promptContext += `- File: ${comment.path}\n- Line: ${comment.line || comment.original_line || 'unknown'}\n`;
            }
            if (comment.diff_hunk) {
              promptContext += `\n### Code Diff Hunk\n\`\`\`diff\n${comment.diff_hunk}\n\`\`\`\n`;
            }
            if (surroundingCode) {
              promptContext += `\n### Surrounding File Context (${comment.path})\n\`\`\`ts\n${surroundingCode}\n\`\`\`\n`;
            }
            if (threadHistory.length > 0) {
              promptContext += `\n### Thread Discussion\n${threadHistory.join('\n\n')}\n`;
            }
            promptContext += `\nDeveloper Query:\n${commentBody.replace(/@strix\b/gi, '').trim()}`;

            const candidateModels = [
              "nvidia/nemotron-3.5-super-vl-120b-a12b",
              "minimaxai/minimax-m3.1-flash",
              "nvidia/nemotron-3-ultra-550b-a55b",
              "nvidia/nemotron-3.5-lightning-30b-a3b",
              "openai/gpt-oss-20b"
            ];

            let aiReply = null;
            let usedModel = null;

            for (const modelId of candidateModels) {
              try {
                core.info(`Querying model: ${modelId}...`);
                const response = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", {
                  method: "POST",
                  headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    model: modelId,
                    messages: [
                      { role: "system", content: systemPrompt },
                      { role: "user", content: promptContext }
                    ],
                    max_tokens: 1500,
                    temperature: 0.2
                  })
                });

                if (!response.ok) {
                  const errText = await response.text();
                  core.warning(`Model ${modelId} failed (${response.status}): ${errText}`);
                  continue;
                }

                const data = await response.json();
                const text = data.choices?.[0]?.message?.content?.trim();
                if (text) {
                  aiReply = text;
                  usedModel = modelId;
                  break;
                }
              } catch (err) {
                core.warning(`Error with model ${modelId}: ${err.message}`);
              }
            }

            if (!aiReply) {
              aiReply = "I was unable to process this query through the NVIDIA AI Gateway at this time. Please check repository logs or re-trigger by mentioning `@strix`.";
              usedModel = "unknown";
            }

            const formattedReply = `> [!NOTE]\n> **Strix Security Assistant** (\`${usedModel}\`)\n\n${aiReply}`;

            try {
              if (isReviewComment && comment.path) {
                const threadCommentId = comment.in_reply_to_id || comment.id;
                await github.rest.pulls.createReplyForReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  comment_id: threadCommentId,
                  body: formattedReply
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: formattedReply
                });
              }

              if (isReviewComment && comment.path) {
                await github.rest.reactions.createForPullRequestReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                  content: 'rocket'
                });
              }
            } catch (err) {
              core.setFailed(`Failed to post Strix response: ${err.message}`);
            }
